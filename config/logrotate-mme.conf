# Configuración de rotación de logs para MME Server (ACTUALIZADA)
# ⚠️ La configuración activa está en: /etc/logrotate.d/server-mme
# Referencia local. Para aplicar cambios, editar /etc/logrotate.d/server-mme
# Forzar rotación: sudo logrotate -f /etc/logrotate.d/server-mme

/home/admonctrlxm/server/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su admonctrlxm admonctrlxm
}

/home/admonctrlxm/server/logs/celery/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su admonctrlxm admonctrlxm
}
