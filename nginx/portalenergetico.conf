# ---------------------------------------------------------------------------
# Portal Energetico - MinEnergia
#
# Fase 46 (2026-10-09): correccion de bucle de redirecciones
# (ERR_TOO_MANY_REDIRECTS).
#
# El portal se publica detras de un WAF perimetral (172.17.10.146) que consulta
# este backend por HTTP:80, no por 443 (verificado el 2026-10-09: conexiones
# activas en el puerto 80 desde 172.17.0.70 y ninguna en el 443).
#
# La Fase 45 dejo en el puerto 80 una redireccion incondicional a HTTPS. Eso
# cerraba un bucle infinito: el WAF devolvia al navegador un 301 hacia https://,
# el navegador volvia al WAF, y el WAF volvia a consultar por el puerto 80.
#
# Ahora ambos puertos los atiende un solo bloque: al trafico que llega desde el
# perimetro (que ya termino TLS arriba) se le sirve el contenido, y solo a los
# clientes directos en HTTP plano se les fuerza HTTPS. Asi se mantiene el
# endurecimiento de la Fase 45 sin reabrir el bucle.
# ---------------------------------------------------------------------------

# Origenes que ya pasaron por el perimetro: el TLS lo termino el WAF.
geo $portal_tras_proxy {
    default        0;
    127.0.0.1/32   1;   # healthchecks locales (monitor_portal.sh)
    ::1/128        1;
    172.17.0.0/16  1;   # red interna MME: WAF perimetral y proxies
}

# Solo se fuerza HTTPS cuando la peticion llega en HTTP plano Y no viene del
# perimetro. Sin esta condicion se reproduce el bucle de la Fase 45.
map "$scheme:$portal_tras_proxy" $portal_forzar_https {
    default   0;
    "http:0"  1;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portalenergetico.minenergia.gov.co www.portalenergetico.minenergia.gov.co 172.17.0.46 localhost;

    ssl_certificate /etc/ssl/certs/portalenergetico.crt;
    ssl_certificate_key /etc/ssl/private/portalenergetico.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # HSTS subido a 6 meses (Fase 45, 2026-09-10; antes 5 min).
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    proxy_read_timeout 300s;
    client_max_body_size 50M;

    # Clientes directos en HTTP plano: forzar HTTPS (Fase 45).
    # El trafico del perimetro no entra aqui, y por eso no se cicla.
    if ($portal_forzar_https) {
        return 301 https://$host$request_uri;
    }

    # API REST
    # WhatsApp Bot API
    location /whatsapp/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Endpoints internos - solo localhost (bot, Celery)
    location /api/v1/internal {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard
    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location ~* ^/_dash- {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
